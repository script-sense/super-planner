name: Deploy to Production

on:
  workflow_dispatch: 
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'static/planner-ui/src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'static/planner-ui/package.json'
      - 'static/planner-ui/package-lock.json'
      - 'manifest.yml'

# Read-only: nothing here writes to the repo. Forge auth comes from the
# FORGE_* secrets, not GITHUB_TOKEN. Declared explicitly so the default
# token scope can never widen it.
permissions:
  contents: read

env:
  # Keep every job on one Node version. 22.6.0 was pinned here previously to
  # dodge a "Premature close" flake in `forge lint`, but it predates stable
  # `require(esm)` (Node 22.12) and default ESM syntax detection (Node 22.7),
  # and the Forge CLI now loads ESM-only dependencies (e.g. get-folder-size@5)
  # through require(). On 22.6.0 that surfaces as
  # "Error: Cannot use import statement outside a module" during `forge lint`.
  # The network flake is handled by the retry loop in the deploy step instead.
  NODE_VERSION: '22.22.1'
  # Pinned so a new Forge CLI release can't break a deploy without a commit.
  FORGE_CLI_VERSION: '13.4.0'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            static/planner-ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: static/planner-ui
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Run frontend tests
        working-directory: static/planner-ui
        run: npm test

      - name: Build frontend
        working-directory: static/planner-ui
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            static/planner-ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: static/planner-ui
        run: npm ci

      - name: Build frontend
        working-directory: static/planner-ui
        run: npm run build

      - name: Install Forge CLI
        run: npm install -g @forge/cli@${{ env.FORGE_CLI_VERSION }}

      - name: Deploy to production
        run: |
          forge settings set usage-analytics false

          # `forge deploy` runs `forge lint`, which fetches Atlassian's OpenAPI
          # specs from developer.atlassian.com. That endpoint intermittently
          # fails with "Premature close" / connection resets, which kills the
          # whole deploy. Retry those, but fail fast on anything else so a real
          # error (lint violation, manifest problem, bad credentials) surfaces
          # immediately instead of being repeated five times.
          attempt=1
          max_attempts=5
          transient='premature close|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up|network socket disconnected|fetch failed|502 Bad Gateway|503 Service|504 Gateway'

          while true; do
            set +e
            output=$(forge deploy -e production --non-interactive 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              break
            fi

            if ! printf '%s\n' "$output" | grep -Eqi "$transient"; then
              echo "forge deploy failed with a non-transient error (exit $status); not retrying."
              exit "$status"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "forge deploy failed after $attempt attempts (exit $status)"
              exit "$status"
            fi

            sleep_for=$((attempt * 15))
            echo "forge deploy attempt $attempt hit a transient network error (exit $status); retrying in ${sleep_for}s..."
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
